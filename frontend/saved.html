<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Saved Pins — PinAI</title>
  <meta name="description" content="Your saved pins on PinAI. Browse and manage your personal photo collection." />
  <meta name="theme-color" content="#000000" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📌</text></svg>" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- Scroll Progress Bar -->
  <div class="scroll-progress" id="scrollProgress"></div>

  <!-- Apple OS Glassmorphism Navbar -->
  <nav class="navbar" id="navbar">
    <div class="navbar__inner">
      <div class="navbar__left">
        <a href="index.html" class="navbar__logo">
          <div class="navbar__logo-icon">P</div>
          <span>PinAI</span>
        </a>

        <div class="navbar__nav">
          <a href="index.html" class="navbar__nav-link">Feed</a>
          <a href="search.html" class="navbar__nav-link">Search</a>
          <a href="saved.html" class="navbar__nav-link active">Saved</a>
          <a href="about.html" class="navbar__nav-link">About &amp; API</a>
        </div>
      </div>

      <div class="navbar__search">
        <span class="navbar__search-icon">🔍</span>
        <input
          type="text"
          class="navbar__search-input"
          id="navSearchInput"
          placeholder="Search photos..."
          autocomplete="off"
        />
      </div>

      <!-- Far Right Corner Container -->
      <div class="navbar__corner">
        <a href="settings.html" class="navbar__icon-btn" title="Settings">⚙️</a>
        <div id="navbarAuthSlot" class="navbar__auth-slot"></div>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="main">
    <div class="container">

      <!-- Saved Header -->
      <div class="saved-header">
        <h1 class="saved-header__title">
          📌 Saved Pins
          <span class="saved-header__count" id="savedCount">0</span>
        </h1>
        <button class="apple-btn apple-btn--danger" id="clearAllBtn">
          🗑️ Clear All
        </button>
      </div>

      <!-- Saved Pins Grid -->
      <div class="masonry-grid" id="savedGrid">
        <!-- Saved pin cards rendered here by saved.js -->
      </div>

      <!-- Empty State -->
      <div class="empty-state hidden" id="emptyState">
        <div class="empty-state__icon">📌</div>
        <h2 class="empty-state__title">No saved pins yet</h2>
        <p class="empty-state__text">
          Start exploring and save photos you love! They'll be curated right here.
        </p>
        <br />
        <a href="index.html" class="apple-btn apple-btn--primary apple-btn--pill" style="display: inline-flex;">
          Explore Photos
        </a>
      </div>

    </div>
  </main>

  <!-- Full Apple OS Footer (Rendered on non-feed pages) -->
  <footer class="apple-footer">
    <div class="apple-footer__inner">
      <div class="apple-footer__top">
        <div class="apple-footer__logo">
          <div class="navbar__logo-icon" style="width: 28px; height: 28px; font-size: 0.95rem;">P</div>
          <span>PinAI</span>
        </div>
        <div class="apple-footer__links">
          <a href="index.html" class="apple-footer__link">Feed</a>
          <a href="search.html" class="apple-footer__link">Search</a>
          <a href="saved.html" class="apple-footer__link">Saved</a>
          <a href="about.html" class="apple-footer__link">About</a>
          <a href="settings.html" class="apple-footer__link">Settings</a>
          <a href="auth.html" class="apple-footer__link">Account</a>
        </div>
      </div>
      <div class="apple-footer__bottom">
        <div>&copy; 2026 PinAI Platform &bull; Apple OS Curation</div>
        <div>
          Powered by
          <a href="https://unsplash.com/?utm_source=pinai&utm_medium=referral" target="_blank" rel="noopener" style="text-decoration: underline; color: var(--text-secondary);">Unsplash</a>
        </div>
      </div>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/modal.js"></script>
  <script src="js/saved.js"></script>

</body>
</html>
